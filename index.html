c.addEventListener('pointerdown',e=>{if(!g||!g.run)return;if(g.mode=='tiles'){const r=c.getBoundingClientRect();tap(Math.min(lanes()-1,Math.max(0,(e.clientX-r.left)/r.width*lanes()|0)))}else foc()});
ov.addEventListener('mouseover',e=>{if(e.target.tagName=='BUTTON')snd('hov')});
// ===== Tiles mode: words fall in lanes, each tile shows the word + its Arabic meaning; tap it before it reaches the bottom =====
const TK={d:0,f:1,j:2,k:3,'1':0,'2':1,'3':2,'4':3},NT=[262,294,330,392,440,523,587,659,784,880,784,659,587,523,440,392,330,294];
const lanes=()=>cw<500?3:4,tileH=()=>Math.max(72,Math.min(112,ch/6));
function note(f){if(S.vol<=0)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(.18*S.vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+.35)}catch(e){}}
function spawnT(){const h=tileH(),free=[];for(let l=0;l<lanes();l++){let top=1e9;for(const t of g.rows)if(t.lane==l&&!t.hit)top=Math.min(top,t.y);if(top>h*1.25)free.push(l)}
if(!free.length)return false;if(!g.bag.length)g.bag=shuf(pick(g.list.slice(0,pool())));g.rows.push({w:g.bag.pop(),lane:free[R()*free.length|0],y:-h,hit:0});return true}
function updT(dt){g.time+=dt;g.sp+=dt;const h=tileH(),sp=ch/10500*TS[S.ts][1]*Math.min(2.4,1+(g.lvl-1)*.09)*dt;
if(g.sp>=Math.max(700,(2000-(g.lvl-1)*110)/TS[S.ts][1])&&spawnT())g.sp=0;
for(const t of g.rows.slice()){if(t.hit){t.hit-=dt;if(t.hit<=0)g.rows.splice(g.rows.indexOf(t),1);continue}
t.y+=sp;if(t.y+h>=ch-4){g.hp--;g.combo=0;g.shake=12;snd('exp');addMiss({full:t.w[0],ar:t.w[1]});g.rows.splice(g.rows.indexOf(t),1);if(g.hp<=0){end();return}}}}
function tap(l){if(!g||!g.run)return;const h=tileH();let b=null;for(const t of g.rows)if(!t.hit&&t.lane==l&&t.y+h>0&&(!b||t.y>b.y))b=t;if(!b)return;
b.hit=250;g.hits++;g.keys++;g.combo++;g.kills++;g.score+=(10+b.w[0].length)*Math.min(5,1+(g.combo/10|0));g.m.add(b.w[0]);g.done.add(b.w[0]);if(g.kills==1)bump();note(NT[(g.kills-1)%NT.length]);if(S.say){const wd=b.w[0];setTimeout(()=>say(wd),0)}
const L=1+(g.kills/10|0);if(L>g.lvl){g.lvl=L;g.ban={t:1200,s:'Level '+L};snd('lvl')}}
function rr(a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h);x.fill()}
function drawT(){const n=lanes(),w=cw/n,h=tileH();x.textAlign='center';x.textBaseline='middle';
x.fillStyle='rgba(255,255,255,.07)';for(let i=1;i<n;i++)x.fillRect(i*w-1,0,2,ch);
const gr=x.createLinearGradient(0,ch-50,0,ch);gr.addColorStop(0,'rgba(255,60,60,0)');gr.addColorStop(1,'rgba(255,60,60,.4)');x.fillStyle=gr;x.fillRect(0,ch-50,cw,50);
for(const t of g.rows){const a=t.lane*w+4,tw=w-8;x.globalAlpha=t.hit?t.hit/250:1;
x.fillStyle=t.hit?'#2ecc71':'#f4f7ff';rr(a,t.y,tw,h,12);
x.fillStyle=t.hit?'#fff':'#0b1a3a';x.font=`bold ${Math.round(fs*1.05)}px Amiri,serif`;x.fillText(t.w[0],a+tw/2,t.y+h*.32,tw-10);
x.fillStyle=t.hit?'#fff':'#a45a00';x.font=`bold ${fs}px Amiri,serif`;x.fillText(t.w[1],a+tw/2,t.y+h*.70,tw-10)}
x.globalAlpha=1;x.textBaseline='top'}
// ===== Drawing =====
function heart(a,b){x.beginPath();x.moveTo(a,b+8);x.bezierCurveTo(a-14,b-4,a-6,b-14,a,b-5);x.bezierCurveTo(a+6,b-14,a+14,b-4,a,b+8);x.fill()}
function rocket(cx,cy){const K=SK[S.skin]||SK[0];x.save();x.translate(cx,cy+14);
const fl=10+Math.random()*10;x.fillStyle='#ff8c00';x.beginPath();x.moveTo(-8,16);x.lineTo(0,24+fl);x.lineTo(8,16);x.fill();x.fillStyle='#ffe066';x.beginPath();x.moveTo(-4,16);x.lineTo(0,16+fl);x.lineTo(4,16);x.fill();
x.fillStyle=K.fin;x.beginPath();x.moveTo(-10,-2);x.lineTo(-25,24);x.lineTo(-10,16);x.fill();x.beginPath();x.moveTo(10,-2);x.lineTo(25,24);x.lineTo(10,16);x.fill();
const q=x.createLinearGradient(-12,0,12,0);q.addColorStop(0,K.b[0]);q.addColorStop(.45,K.b[1]);q.addColorStop(1,K.b[0]);x.fillStyle=q;x.beginPath();x.moveTo(0,-36);x.quadraticCurveTo(15,-14,12,18);x.lineTo(-12,18);x.quadraticCurveTo(-15,-14,0,-36);x.fill();
x.fillStyle=K.nose;x.beginPath();x.moveTo(0,-36);x.quadraticCurveTo(9,-26,10,-17);x.lineTo(-10,-17);x.quadraticCurveTo(-9,-26,0,-36);x.fill();
x.fillStyle=K.win;x.beginPath();x.arc(0,-4,5.5,0,7);x.fill();x.strokeStyle='#345';x.lineWidth=2;x.stroke();x.restore()}
function draw(){x.save();x.drawImage(bgImg(g?g.mode:'classic'),0,0,cw,ch);
if(g&&g.shake>0)x.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);
x.fillStyle=(TH[g?g.mode:'classic']||TH.classic)[3];for(const s of stars){x.globalAlpha=.3+s.s/3;x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;
if(g&&g.mode=='tiles')drawT();else if(!hideR)rocket(px(),py());x.textBaseline='top';x.textAlign='left';
if(g){x.font=F();
for(const w of g.ws){const col=w.fl>0?'#ff8c00':w===g.act?'#00ff66':SC[w.sp]||'#fff';x.fillStyle=col;x.fillText(w.left,w.x,w.y);
if(g.tr)x.fillText(' ('+w.ar+')',w.x+w.wl,w.y);
const mx=w.x+w.w+25,my=w.y+fs*.6,r=M[0].width/4;x.drawImage(M[w.sp||(w===g.act?1:0)],mx-r,my-r,2*r,2*r)}
for(const b of g.bl){x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillStyle='#00c8ff';x.fillRect(-14,-3,28,6);x.restore()}
for(const f of g.fx){const a=1-f.t/450;x.globalAlpha=Math.max(0,a);x.strokeStyle='#ffb347';x.lineWidth=4;x.beginPath();x.arc(f.x,f.y,8+f.t*.1,0,7);x.stroke();x.fillStyle='#ff5a1f';x.beginPath();x.arc(f.x,f.y,Math.max(0,24-f.t*.05),0,7);x.fill();x.globalAlpha=1}
x.fillStyle='#ff4d6d';for(let i=0;i<g.hp;i++)heart(22+i*26,22);
x.font='bold 22px Amiri,serif';x.fillStyle='#00c8ff';x.textAlign='right';x.fillText('Score: '+g.score,cw-12,10);
x.textAlign='left';x.font='bold 18px Amiri,serif';x.fillStyle='#bcd';const m=g.time/60000;x.fillText(`Lv ${g.lvl} · ${m>.05?Math.round(g.hits/(g.mode=='tiles'?1:5)/m):0} WPM`,12,42);
if(g.combo>=5){x.fillStyle='#ffd27a';x.textAlign='center';x.fillText(`Combo ${g.combo} · x${Math.min(5,1+(g.combo/10|0))}`,cw/2,10)}
if(g.ban&&g.ban.t>0&&g.run){x.globalAlpha=Math.min(1,g.ban.t/500);x.font='bold 56px Amiri,serif';x.fillStyle='#00ff66';x.textAlign='center';x.fillText(g.ban.s,cw/2,ch*.35);x.globalAlpha=1}}
x.restore()}
function loop(t){const dt=Math.min(50,t-last||16);last=t;
for(const s of stars){s.y+=s.s*.6*dt/16;if(s.y>ch){s.y=0;s.x=Math.random()*cw}}
if(g){if(g.run)upd(dt);if(g)for(const f of g.fx)f.t+=dt;if(g){g.fx=g.fx.filter(f=>f.t<450);if(g.ban)g.ban.t-=dt;if(g.shake>0)g.shake-=.6}}
draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
